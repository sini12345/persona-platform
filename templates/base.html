<!DOCTYPE html>
<html lang="da" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personatræning{% endblock %}</title>
    <link rel="stylesheet" href="/static/tailwind.css">
    <script src="/static/htmx.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chat-bubble-user {
            background: #f0f4f8;
            border-radius: 18px 18px 4px 18px;
        }
        .chat-bubble-persona {
            background: #1e293b;
            color: #f1f5f9;
            border-radius: 18px 18px 18px 4px;
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            width: 6px; height: 6px; border-radius: 50%;
            display: inline-block; background: #94a3b8;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        /* Tailwind CDN ships without the Typography plugin, so style .prose content manually */
        .prose h1, .prose h2 { font-size: 1.125rem; font-weight: 600; color: #0f172a; margin: 1.25rem 0 .5rem; }
        .prose h3 { font-size: 1rem; font-weight: 600; color: #0f172a; margin: 1.1rem 0 .35rem; }
        .prose > :first-child { margin-top: 0; }
        .prose p { margin: .5rem 0; line-height: 1.65; }
        .prose ul { list-style: disc; padding-left: 1.25rem; margin: .5rem 0; }
        .prose ol { list-style: decimal; padding-left: 1.25rem; margin: .5rem 0; }
        .prose li { margin: .25rem 0; line-height: 1.6; }
        .prose hr { border: 0; border-top: 1px solid #e2e8f0; margin: 1rem 0; }
        .prose strong { font-weight: 600; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 text-slate-800">
    {% block body %}{% endblock %}
</body>
</html>
